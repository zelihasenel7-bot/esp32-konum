<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ESP32 Konum</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>

    body {
      font-family: Arial;
      text-align: center;
      background: #f3f3f3;
      padding: 40px;
    }

    .kart {
      background: white;
      max-width: 400px;
      margin: auto;
      padding: 30px;
      border-radius: 18px;
    }

    button {
      padding: 16px 25px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    #durum {
      margin: 25px 0;
      font-size: 18px;
    }

  </style>
</head>


<body>

<div class="kart">

  <h1>📍 ESP32 Konum</h1>

  <p id="durum">
    Konum alınmaya hazır.
  </p>

  <button onclick="konumAl()">
    📍 Konumumu Gönder
  </button>

  <br><br>

  <button
  type="button"
  id="hedefBelirleButton"
  onclick="hedefAlaniniAc()"
>
  🎯 Hedef Belirle
</button>

<br><br>

  <div id="hedefSecimAlani" style="display:none;">

<input
  type="text"
  id="hedefArama"
  placeholder="Gitmek istediğiniz yeri yazın"
  style="font-size:18px;padding:12px;width:80%;max-width:350px;"
>

<br><br>

<button type="button" onclick="ilAdiminiGoster()">
  🔎 Hedefi Ara
</button>

<div id="ilAdimi" style="display:none;">

  <br><br>

  <p><b>İl seçin:</b></p>

  <input
    type="text"
    id="hedefIl"
    placeholder="İl yazın. Örneğin: Ankara"
    style="font-size:18px;padding:12px;width:80%;max-width:350px;"
  >

  <br><br>

  <button type="button" onclick="hedefAra()">
    🔎 Sonuçları Göster
  </button>

</div>
    <p id="hedefDurum"></p>

<br><br>

<button onclick="hedefSec()">🗺️ Haritadan Seç</button>

</div>

<div id="harita" style="display:none; height:350px; margin-top:20px;"></div>
  <div id="hedefOnay"></div>

  <hr>

  <hr>

  <button
  type="button"
  id="guvenliBolgeButton"
  onclick="guvenliBolgeAlaniniAc()"
>
  🛡️ Güvenli Bölgeyi Ayarla
</button>

<br><br>

<div id="guvenliBolgeAlani" style="display:none;position:relative;">

  <div style="width:100%;text-align:right;box-sizing:border-box;padding-right:15px;height:40px;">
  <span
    onclick="guvenliBolgeAlaniniKapat()"
    style="font-size:32px;color:#555;cursor:pointer;"
  >
    ✕
  </span>
</div>

<h2>🛡️ Güvenli Bölge Ayarı</h2>

<select id="guvenliBolgeSec"
style="font-size:18px;padding:10px;width:80%;max-width:300px;">
  <option value="10">10 metre</option>
  <option value="20">20 metre</option>
  <option value="50">50 metre</option>
  <option value="100">100 metre</option>
</select>

<br><br>

<button onclick="guvenliBolgeKaydet()">
  ✅ Güvenli Bölgeyi Kaydet
</button>

<p id="guvenliBolgeMesaj"></p>
  </div>

<hr>



<button onclick="konumGecmisiniGetir()">
  🕘 Konum Geçmişi
</button>

<div id="konumGecmisi">
  <p>Henüz konum geçmişi gösterilmedi.</p>
</div>

</div>


<script>

  async function guvenliBolgeKaydet() {

  const metre = document.getElementById("guvenliBolgeSec").value;
  const mesaj = document.getElementById("guvenliBolgeMesaj");

  mesaj.innerHTML = "⏳ Güvenli bölge kaydediliyor...";

  try {

    const response = await fetch(
      "http://172.20.10.2/guvenli-bolge-ayarla?metre=" +
      encodeURIComponent(metre)
    );

    if (response.ok) {
      mesaj.innerHTML =
        "✅ Güvenli bölge " + metre + " metre olarak ayarlandı.";
    } else {
      mesaj.innerHTML = "❌ Güvenli bölge ayarlanamadı.";
    }

  } catch (error) {

    mesaj.innerHTML = "❌ ESP32'ye ulaşılamadı.";
  }
}

  async function konumGecmisiniGetir() {

  const alan = document.getElementById("konumGecmisi");

  alan.innerHTML = "⏳ Konum geçmişi yükleniyor...";

  try {

    const response = await fetch("http://172.20.10.2/gecmis");

    const gecmis = await response.json();

    if (gecmis.length === 0) {
      alan.innerHTML = "📭 Henüz kayıtlı konum yok.";
      return;
    }

    let html = "";

    for (let i = gecmis.length - 1; i >= 0; i--) {

      const kayit = gecmis[i];

      let adres = "Konum";

      try {

        const adresResponse = await fetch(
          "https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=" +
          encodeURIComponent(kayit.lat) +
          "&lon=" +
          encodeURIComponent(kayit.lon)
        );

        const adresData = await adresResponse.json();

        if (adresData && adresData.display_name) {
          adres = adresData.display_name;
        }

      } catch (e) {
        adres = "Adres alınamadı";
      }

      html +=
        "<div style='margin:15px 0;padding:12px;border:1px solid #ccc;border-radius:10px;'>" +
        "🕐 <b>" + kayit.saat + "</b><br>" +
        "📍 " + adres + "<br><br>" +
        "<button onclick='gecmisiHaritadaGoster(" +
        kayit.lat + "," + kayit.lon +
        ")'>🗺️ Haritada Göster</button>" +
        "</div>";
    }

    alan.innerHTML = html;

  } catch (error) {

    alan.innerHTML =
      "❌ Konum geçmişi ESP32'den alınamadı.";
  }
}


function gecmisiHaritadaGoster(lat, lon) {

  const haritaDiv = document.getElementById("harita");

  haritaDiv.style.display = "block";

  if (!harita) {

    harita = L.map("harita").setView([lat, lon], 16);

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "© OpenStreetMap"
      }
    ).addTo(harita);

  } else {

    harita.setView([lat, lon], 16);
  }

  L.marker([lat, lon])
    .addTo(harita)
    .bindPopup("📍 Geçmiş konum")
    .openPopup();

  setTimeout(function() {
    harita.invalidateSize();
  }, 200);
}

  function guvenliBolgeAlaniniAc() {
  document.getElementById("guvenliBolgeAlani").style.display = "block";
  document.getElementById("guvenliBolgeButton").style.display = "none";
}

function guvenliBolgeAlaniniKapat() {
  document.getElementById("guvenliBolgeAlani").style.display = "none";
  document.getElementById("guvenliBolgeButton").style.display = "inline-block";
}

  function hedefAlaniniAc() {
  document.getElementById("hedefSecimAlani").style.display = "block";
  document.getElementById("hedefBelirleButton").style.display = "none";
  document.getElementById("hedefArama").focus();
}

function ilAdiminiGoster() {
  const hedef = document.getElementById("hedefArama").value.trim();
  const ilAdimi = document.getElementById("ilAdimi");

  if (hedef === "") {
    alert("Önce gitmek istediğiniz yeri yazın.");
    return;
  }

  if (ilAdimi.style.display === "block") {
    hedefAra();
    return;
  }

  ilAdimi.style.display = "block";
  document.getElementById("hedefIl").focus();
}
  
  async function hedefAra() {

    document.getElementById("harita").style.display = "none";

  const arama = document.getElementById("hedefArama").value.trim();
    const il = document.getElementById("hedefIl").value.trim();
const sorgu = arama + ", " + il + ", Türkiye";

  if (arama === "" || il === "") {
    alert("Lütfen hedefi ve ili yazın.");
    return;
  }

  document.getElementById("hedefDurum").innerHTML =
    "🔎 Hedef aranıyor...";

  try {

    const response = await fetch(
     "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&countrycodes=tr&q=" +
      encodeURIComponent(sorgu)
    );

    const data = await response.json();

    if (data.length === 0) {
      document.getElementById("hedefDurum").innerHTML =
        "❌ Hedef bulunamadı.";
      return;
    }

    let sonucHTML = "🔎 <b>Arama sonuçlarından birini seç:</b><br><br>";

data.forEach((yer, index) => {
  sonucHTML +=
    "<button onclick='aramaSonucuSec(" + index + ")' " +
    "style='margin:6px;padding:10px;width:90%;'>" +
    "📍 " + yer.display_name +
    "</button><br>";
});

document.getElementById("hedefDurum").innerHTML = sonucHTML;

window.aramaSonuclari = data;

return;
    
  } catch (error) {

    document.getElementById("hedefDurum").innerHTML =
      "❌ Hedef aranırken hata oluştu.";

  }
}

  function aramaSonucuSec(index) {

  const yer = window.aramaSonuclari[index];

  if (!yer) {
    alert("Hedef seçilemedi.");
    return;
  }

  const hedefLat = parseFloat(yer.lat);
  const hedefLon = parseFloat(yer.lon);
  const hedefAdi = yer.display_name;

  const kisaAdres = hedefAdi
    .split(",")
    .slice(0, 3)
    .join(",");
    
localStorage.setItem("secilenHedefAdres", kisaAdres);

document.getElementById("hedefDurum").innerHTML =
    "🎯 <b>Seçilen Hedef</b><br>📍 " + kisaAdres;

  const espHedefAdres =
    "http://172.20.10.2/hedef?hedefLat=" +
    encodeURIComponent(hedefLat) +
    "&hedefLon=" +
    encodeURIComponent(hedefLon) +
"&hedefAdres=" +
encodeURIComponent(kisaAdres);

  secilenHedefUrl = espHedefAdres;

hedefSec();

harita.setView([hedefLat, hedefLon], 16);

if (hedefMarker) {
  harita.removeLayer(hedefMarker);
}

hedefMarker = L.marker([hedefLat, hedefLon])
  .addTo(harita)
  .bindPopup(kisaAdres)
  .openPopup();

setTimeout(() => {
  harita.invalidateSize();
}, 200);

document.getElementById("hedefDurum").innerHTML =
  "🎯 <b>Seçilen Hedef</b><br>📍 " + kisaAdres;

document.getElementById("hedefOnay").innerHTML =
  "<br><button onclick='secilenHedefiKaydet()'>" +
   "✅ Bu hedefi kaydet</button>";

}

function secilenHedefiKaydet() {
  if (secilenHedefUrl === "") {
    alert("Önce bir hedef seçin.");
    return;
  }

  window.location.href = secilenHedefUrl;
}

function konumAl() {

  document.getElementById("durum").innerHTML =
    "📡 Konum aranıyor...";

  if (!navigator.geolocation) {

    document.getElementById("durum").innerHTML =
      "❌ Telefon konum özelliğini desteklemiyor.";

    return;
  }


  navigator.geolocation.getCurrentPosition(

    function(position) {

      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      const acc = position.coords.accuracy;
      const simdi = new Date();
const saat = simdi.toLocaleTimeString("tr-TR");

      document.getElementById("durum").innerHTML =
        "✅ Konum bulundu! ESP32'ye gönderiliyor...";

      const adres =
        "http://172.20.10.2/konum?lat=" +
        encodeURIComponent(lat) +
        "&lon=" +
        encodeURIComponent(lon) +
        "&acc=" +
encodeURIComponent(acc) +
"&saat=" +
encodeURIComponent(saat);

      window.location.href = adres;
    },


    function(error) {

      document.getElementById("durum").innerHTML =
        "❌ Konum alınamadı. Hata kodu: " + error.code;

    },


    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );
}

  let harita;
let hedefMarker;
  let secilenHedefUrl = "";

function hedefSec() {

  const haritaDiv = document.getElementById("harita");
  haritaDiv.style.display = "block";

  if (!harita) {

    harita = L.map("harita").setView([39.93, 32.85], 12);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "© OpenStreetMap"
    }).addTo(harita);

    harita.on("click", function(e) {

      const hedefLat = e.latlng.lat;
      const hedefLon = e.latlng.lng;


      let hedefAdi = "Seçilen konum";

fetch(
  "https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=" +
  encodeURIComponent(hedefLat) +
  "&lon=" +
  encodeURIComponent(hedefLon)
)
.then(response => response.json())
.then(data => {

  if (data && data.display_name) {
    hedefAdi = data.display_name;
  }

  document.getElementById("hedefDurum").innerHTML =
    "🎯 Hedef: " + hedefAdi;

})
.catch(() => {
  document.getElementById("hedefDurum").innerHTML =
    "📍 Hedef seçildi";
});

const espHedefAdres =
  "http://172.20.10.2/hedef?hedefLat=" +
  encodeURIComponent(hedefLat) +
  "&hedefLon=" +
  encodeURIComponent(hedefLon);

secilenHedefUrl = espHedefAdres;

hedefSec();
harita.off("click");

harita.setView([hedefLat, hedefLon], 16);

if (hedefMarker) {
  harita.removeLayer(hedefMarker);
}

hedefMarker = L.marker([hedefLat, hedefLon])
  .addTo(harita)
  .bindPopup(kisaAdres)
  .openPopup();

setTimeout(() => {
  harita.invalidateSize();
}, 200);

document.getElementById("hedefDurum").innerHTML =
  "🎯 <b>Seçilen Hedef</b><br>📍 " + kisaAdres +
  "<br><br><button onclick='secilenHedefiKaydet()'>" +
  "✅ Bu hedefi kaydet</button>";
      
      if (hedefMarker) {
        harita.removeLayer(hedefMarker);
      }

      hedefMarker = L.marker([hedefLat, hedefLon]).addTo(harita);

      document.getElementById("hedefDurum").innerHTML =
        "📍 Hedef seçildi!";

      
    });
  }

  setTimeout(function() {
    harita.invalidateSize();
  }, 200);
}
  const params = new URLSearchParams(window.location.search);

if (params.get("hedef") === "ok") {

    const kayitliAdres = localStorage.getItem("secilenHedefAdres");

    if (kayitliAdres) {
        document.getElementById("hedefDurum").innerHTML =
            "✅ Hedef kaydedildi!<br><br>" +
            "🎯 <b>Seçilen Hedef</b><br>" +
            "📍 " + kayitliAdres;
    } else {
        document.getElementById("hedefDurum").innerHTML =
            "✅ Hedef kaydedildi!";
    }

    document.getElementById("hedefSecimAlani").style.display = "none";
}

  window.addEventListener("pageshow", function() {
  document.getElementById("hedefSecimAlani").style.display = "none";
  document.getElementById("hedefBelirleButton").style.display = "inline-block";
  document.getElementById("ilAdimi").style.display = "none";

    document.getElementById("guvenliBolgeAlani").style.display = "none";
document.getElementById("guvenliBolgeButton").style.display = "inline-block";
});
</script>

</body>
</html>
