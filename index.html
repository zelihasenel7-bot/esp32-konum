<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ESP32 Konum</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>

    body {
      font-family: Arial;
      text-align: center;
      background: #f3f3f3;
      padding: 40px;
    }

    .kart {
      background: white;
      max-width: 400px;
      margin: auto;
      padding: 30px;
      border-radius: 18px;
    }

    button {
      padding: 16px 25px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    #durum {
      margin: 25px 0;
      font-size: 18px;
    }

  </style>
</head>


<body>

<div class="kart">

  <h1>📍 ESP32 Konum</h1>

  <p id="durum">
    Konum alınmaya hazır.
  </p>

  <button onclick="konumAl()">
    Konumumu Bul ve ESP32'ye Gönder
  </button>

  <br><br>

<button onclick="hedefSec()">🎯 Hedef Seç</button>

<div id="harita" style="display:none; height:350px; margin-top:20px;"></div>

<p id="hedefDurum"></p>

</div>


<script>

function konumAl() {

  document.getElementById("durum").innerHTML =
    "📡 Konum aranıyor...";

  if (!navigator.geolocation) {

    document.getElementById("durum").innerHTML =
      "❌ Telefon konum özelliğini desteklemiyor.";

    return;
  }


  navigator.geolocation.getCurrentPosition(

    function(position) {

      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      const acc = position.coords.accuracy;
      const simdi = new Date();
const saat = simdi.toLocaleTimeString("tr-TR");

      document.getElementById("durum").innerHTML =
        "✅ Konum bulundu! ESP32'ye gönderiliyor...";

      const adres =
        "http://172.20.10.2/konum?lat=" +
        encodeURIComponent(lat) +
        "&lon=" +
        encodeURIComponent(lon) +
        "&acc=" +
encodeURIComponent(acc) +
"&saat=" +
encodeURIComponent(saat);

      window.location.href = adres;
    },


    function(error) {

      document.getElementById("durum").innerHTML =
        "❌ Konum alınamadı. Hata kodu: " + error.code;

    },


    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );
}

  let harita;
let hedefMarker;

function hedefSec() {

  const haritaDiv = document.getElementById("harita");
  haritaDiv.style.display = "block";

  if (!harita) {

    harita = L.map("harita").setView([39.93, 32.85], 12);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "© OpenStreetMap"
    }).addTo(harita);

    harita.on("click", function(e) {

      const hedefLat = e.latlng.lat;
      const hedefLon = e.latlng.lng;

      let hedefAdi = "Seçilen konum";

fetch(
  "https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=" +
  encodeURIComponent(hedefLat) +
  "&lon=" +
  encodeURIComponent(hedefLon)
)
  .then(response => response.json())
  .then(data => {

    if (data && data.display_name) {
      hedefAdi = data.display_name;
    }

    document.getElementById("hedefDurum").innerHTML =
      "🎯 Hedef: " + hedefAdi;

  })
  .catch(() => {

    document.getElementById("hedefDurum").innerHTML =
      "📍 Hedef seçildi";

  });

      if (hedefMarker) {
        harita.removeLayer(hedefMarker);
      }

      hedefMarker = L.marker([hedefLat, hedefLon]).addTo(harita);

      document.getElementById("hedefDurum").innerHTML =
        "📍 Hedef seçildi!";

      const hedefAdres =
    "http://172.20.10.2/hedef?hedefLat=" +
    encodeURIComponent(hedefLat) +
    "&hedefLon=" +
    encodeURIComponent(hedefLon);

fetch(hedefAdres, { mode: "no-cors" })
  .then(() => {
    document.getElementById("hedefDurum").innerHTML =
      "✅ Hedef ESP32'ye gönderildi!";
  })
  .catch(() => {
    document.getElementById("hedefDurum").innerHTML =
      "❌ Hedef gönderilemedi!";
  });
    });
  }

  setTimeout(function() {
    harita.invalidateSize();
  }, 200);
}
  const params = new URLSearchParams(window.location.search);

if (params.get("hedef") === "ok") {
  document.getElementById("hedefDurum").innerHTML =
    "✅ Hedef kaydedildi!";
}

</script>

</body>
</html>
