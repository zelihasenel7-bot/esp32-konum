<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ESP32 Konum</title>

  <style>

    body {
      font-family: Arial;
      text-align: center;
      background: #f3f3f3;
      padding: 40px;
    }

    .kart {
      background: white;
      max-width: 400px;
      margin: auto;
      padding: 30px;
      border-radius: 18px;
    }

    button {
      padding: 16px 25px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    #durum {
      margin: 25px 0;
      font-size: 18px;
    }

  </style>
</head>


<body>

<div class="kart">

  <h1>📍 ESP32 Konum</h1>

  <p id="durum">
    Konum alınmaya hazır.
  </p>

  <button onclick="konumAl()">
    Konumumu Bul ve ESP32'ye Gönder
  </button>

</div>


<script>

function konumAl() {

  document.getElementById("durum").innerHTML =
    "📡 Konum aranıyor...";

  if (!navigator.geolocation) {

    document.getElementById("durum").innerHTML =
      "❌ Telefon konum özelliğini desteklemiyor.";

    return;
  }


  navigator.geolocation.getCurrentPosition(

    function(position) {

      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      const acc = position.coords.accuracy;
      const simdi = new Date();
const saat = simdi.toLocaleTimeString("tr-TR");

      document.getElementById("durum").innerHTML =
        "✅ Konum bulundu! ESP32'ye gönderiliyor...";

      const adres =
        "http://172.20.10.2/konum?lat=" +
        encodeURIComponent(lat) +
        "&lon=" +
        encodeURIComponent(lon) +
        "&acc=" +
encodeURIComponent(acc) +
"&saat=" +
encodeURIComponent(saat);

      window.location.href = adres;
    },


    function(error) {

      document.getElementById("durum").innerHTML =
        "❌ Konum alınamadı. Hata kodu: " + error.code;

    },


    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );
}

</script>

</body>
</html>
